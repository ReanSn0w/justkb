name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run backend tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Run linter
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  container-smoke:
    name: SQLite container smoke test
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build smoke image
        run: docker build --tag jkb:smoke .

      - name: Migrate persistent volume
        run: |
          docker volume create jkb-smoke-data
          docker run --rm \
            --env JKB_DATABASE_PATH=/var/lib/jkb/jkb.sqlite \
            --env JKB_STORAGE_PATH=/var/lib/jkb/files \
            --volume jkb-smoke-data:/var/lib/jkb \
            jkb:smoke jkb-migrate up

      - name: Start, restart, and verify persisted database
        run: |
          docker run --detach --name jkb-smoke \
            --env JKB_DATABASE_PATH=/var/lib/jkb/jkb.sqlite \
            --env JKB_STORAGE_PATH=/var/lib/jkb/files \
            --env JKB_COOKIE_SECURE=false \
            --publish 18080:8080 \
            --volume jkb-smoke-data:/var/lib/jkb \
            jkb:smoke
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/health/ready && break
            sleep 1
          done
          curl --fail http://127.0.0.1:18080/health/ready
          docker restart jkb-smoke
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/health/ready && break
            sleep 1
          done
          curl --fail http://127.0.0.1:18080/health/ready
          docker run --rm \
            --env JKB_DATABASE_PATH=/var/lib/jkb/jkb.sqlite \
            --env JKB_STORAGE_PATH=/var/lib/jkb/files \
            --volume jkb-smoke-data:/var/lib/jkb \
            jkb:smoke jkb-migrate status

      - name: Clean smoke resources
        if: always()
        run: |
          docker rm --force jkb-smoke 2>/dev/null || true
          docker volume rm jkb-smoke-data 2>/dev/null || true

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs:
      - container-smoke
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jkb
      POSTGRES_USER: jkb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jkb -d jkb']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
    environment:
      JKB_DATABASE_URL: postgres://jkb:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/jkb?sslmode=disable
      JKB_LISTEN_ADDRESS: :8080
      JKB_STORAGE_PATH: /var/lib/jkb/attachments
      JKB_COOKIE_SECURE: ${JKB_COOKIE_SECURE:-true}
      JKB_PUBLIC_URL: ${JKB_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health/ready']
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - '${JKB_PORT:-8080}:8080'
    volumes:
      - attachments:/var/lib/jkb/attachments
    restart: unless-stopped

volumes:
  postgres-data:
  attachments:

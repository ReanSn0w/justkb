services:
  app:
    image: ${JKB_IMAGE:-ghcr.io/reansn0w/justkb:latest}
    build:
      context: .
    environment:
      JKB_DATABASE_PATH: /var/lib/jkb/jkb.sqlite
      JKB_LISTEN_ADDRESS: :8080
      JKB_STORAGE_PATH: /var/lib/jkb/files
      JKB_SYSTEM_NAME: ${JKB_SYSTEM_NAME:-JKB}
      JKB_ICON_COLOR: ${JKB_ICON_COLOR:-#2563EB}
      JKB_COOKIE_SECURE: ${JKB_COOKIE_SECURE:-true}
      JKB_PUBLIC_URL: ${JKB_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health/ready']
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - '${JKB_PORT:-8080}:8080'
    volumes:
      - data:/var/lib/jkb
    restart: unless-stopped

volumes:
  data:
